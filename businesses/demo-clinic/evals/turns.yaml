# Synthetic labelled turns (spec §14). Each case starts as a later turn, so no
# disclosure is added, unless it says `fresh: true` (the first turn of a conversation).
# `messages` holds a conversation; `expect` checks its last turn and lists only what
# must hold for any model: the offline run uses the deterministic demo models, live
# runs the real one.
- id: price-it
  message: "Quanto costa la fisioterapia?"
  expect: {outcome: replied, language: it, intent: price, contains: ["30 EUR"], sources: ["price:physiotherapy"]}
- id: price-sq-plain
  message: "sa kushton fizioterapia"
  tags: [no-diacritics]
  expect: {outcome: replied, language: sq, intent: price, contains: ["30 EUR"]}
- id: price-sq
  message: "Sa kushton fizioterapia në klinikë?"
  expect: {outcome: replied, language: sq, intent: price, contains: ["30 EUR"]}
- id: price-en
