name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -m "not eval"
      - name: offline evaluations
        run: uv run pytest -m eval -v
      - name: audit runtime dependencies
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project --output-file requirements-audit.txt
          uvx pip-audit --disable-pip --requirement requirements-audit.txt
